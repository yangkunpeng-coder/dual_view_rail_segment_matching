# 从项目根目录执行 conda env create -f environment.yml。
# 适用 Windows 和 Linux x86_64 的 NVIDIA CUDA 13.0 环境。
# 本地源码提交
# ultralytics_src 9c69b49d7a91b68ccf20ac6412ae4d49a2f56cc9
# sam3_src f1647e8d0c1d280991f4d1b7d974c2704537fe66
name: rail
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12.16
  - pip=26.2.2
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch==2.12.1+cu130
      - torchvision==0.27.1+cu130
      - numpy==1.26.4
      - opencv-python==4.11.0.86
      - pillow==13.0.0
      - matplotlib==3.11.2
      - PyYAML==6.0.3
      - tensorboard==2.21.0
      - requests==2.34.2
      - psutil==7.2.2
      - polars==2.1.0
      - nvidia-ml-py==13.615.71
      - ultralytics-thop==2.2.5
      - ultralytics-platform==0.1.107
      - -e ./ultralytics_src
      # SAM3 当前通过 pkg_resources 读取包内词表。
      - setuptools==78.1.0
      - timm==1.0.31
      - tqdm==4.70.1
      - ftfy==6.1.1
      - regex==2026.11.9
      - iopath==0.1.10
      - typing-extensions==4.16.0
      - huggingface-hub==2.4.0
      - einops==0.8.2
      - pycocotools==2.0.11
      - 'triton-windows==3.7.1.post27; sys_platform == "win32"'
      - -e ./sam3_src
