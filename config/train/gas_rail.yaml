# GAS-Rail 的生效参数；训练入口会把它快照到实验目录的 configs/ 下。
# 开关统一在 train_rail_seg.yaml 的 gas.enabled，这里不放 enabled，避免两处开关打架。
# 权重为 0 即该项关闭；头通道数按权重推导：1 中心线，+2 方向/平滑，+1 宽度。

# 四项辅助损失权重。实测初始量级（零初始化头部、单 batch）：
# center 原始值约 1.96、direction 约 1.0、width 约 0.5。按原生损失约 1.49 折算，
# 下面的初值在训练首轮约占 6.6% 与 1.3%，再乘 warmup 增益。换数据或换 batch 后按
# 方案 §4.7 的公式用 5 轮标定跑重新求解。
# 当前阶段：L1 只开中心线（单变量）。L2 再把 direction_weight 设为 0.02。
center_weight: 0.05
direction_weight: 0.0
smooth_weight: 0.0
width_weight: 0.0
# 原生实例掩码损失里的 Dice 项；不为 0 时不需要辅助头
dice_weight: 0.0

# 权重 warmup：从 1/warmup_epochs 线性升到 1
warmup_epochs: 3.0
# 平滑项的采样步长，单位原型格
smooth_delta: 1.0

target:
  mask_ratio: 4          # 必须等于 Proto 的 imgsz/4
  sigma_cells: 0.75
  direction_band_cells: 2.0
  tangent_window: 5
  tangent_max_residual_px: 1.5

head:
  hidden_channels: null  # null 时单通道用 16、多通道用 32
  centerline_prior: 0.02
  width_prior: 1.9
