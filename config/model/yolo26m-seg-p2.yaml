# 草案：YOLO26-seg 增加 P2/4 预测尺度（四尺度进入 Segment26 与 Proto26）。
# 与 config/model/yolo26m-seg.yaml 的差异仅在 head 末尾的三层与 Segment26 输入。
# nc 是预训练模型的类别数，训练时由数据集配置覆盖。
nc: 80
end2end: true
reg_max: 1
scales:
  # [深度系数, 宽度系数, 最大通道数]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [输入层, 重复次数, 模块, 参数]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, false, 0.25]] # 2-P2/4（P2 特征来源）
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, false, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, true]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, true]]
  - [-1, 1, SPPF, [1024, 5, 3, true]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [null, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12
  - [-1, 2, C3k2, [512, true]] # 13

  - [-1, 1, nn.Upsample, [null, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15
  - [-1, 2, C3k2, [256, true]] # 16-P3/8

  - [-1, 1, Conv, [256, 3, 2]] # 17
  - [[-1, 13], 1, Concat, [1]] # 18
  - [-1, 2, C3k2, [512, true]] # 19-P4/16

  - [-1, 1, Conv, [512, 3, 2]] # 20
  - [[-1, 10], 1, Concat, [1]] # 21
  - [-1, 1, C3k2, [1024, true, 0.5, true]] # 22-P5/32

  # ===== 新增 P2/4 top-down 融合（相对基线只多这三层）=====
  # 第 23 层必须显式引用第 16 层（P3）；用 -1 会取到 P5。
  - [16, 1, nn.Upsample, [null, 2, "nearest"]] # 23: P3 上采样到 stride 4
  - [[-1, 2], 1, Concat, [1]] # 24: 与 backbone 的 P2/4 拼接
  - [-1, 2, C3k2, [256, true]] # 25-P2/4

  # 四尺度顺序必须为 [P2, P3, P4, P5]。
  - [[25, 16, 19, 22], 1, Segment26, [nc, 32, 256]] # 26
